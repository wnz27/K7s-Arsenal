  - capability_id: cap.twh.feedback-and-traffic-anxiety
    revision: 1
    status: active
    slug: feedback-and-traffic-anxiety
    title: 负面反馈与流量焦虑的分类应对
    importance: high
    importance_rationale: 对应 task-11；跨 4 篇交叉印证，含真实失败案例（大 V 恶评关评论两年），是坚持写作的必要支撑
    one_liner: 先分类再行动——误解类视影响决定澄清（勘误是职责），恶意类无响应义务；用反馈漏斗与叫好叫座双体系校准流量预期
    intents:
      - 文章收到恶评/被杠精攻击，要不要回应
      - 认真写的文章没人看很沮丧怎么办
      - 要不要追热点/迎合流量写作
    keywords: [负面评论, 恶评, 流量焦虑, 数字枷锁, 心态, negative feedback, criticism, traffic anxiety]
    also_read: [writing-habit-design, distribution-last-mile]
    card: cards/feedback-and-traffic-anxiety.md
    frontmatter:
      description: 当用户因文章收到负面评论/恶意攻击纠结是否回应、因阅读量低沮丧、或纠结要不要迎合流量写作时使用。提供反馈分类响应机制（误解/恶意）、评论分量判断、反馈漏斗与叫好叫座双评价体系校准。不用于文章本身的改进（用 article-quality-review）或传播渠道选择（用 distribution-last-mile）。
